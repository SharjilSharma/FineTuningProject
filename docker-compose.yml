services:
  postgres:
    image: postgres:16
    container_name: earnings-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: earnings_agent
      POSTGRES_PASSWORD: localdevonly   # local dev only, fine to be simple
      POSTGRES_DB: earnings_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: earnings-agent-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
